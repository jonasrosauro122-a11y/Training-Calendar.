<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAVA Automation – Multi-VA Training Schedule Portal</title>
  
  <!-- Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --lava-red: #D10000;
      --lava-dark-red: #8B0000;
      --lava-header-bg: #7A0000;
      --bg-dark: #0D0203;
      --card-border: #2A080C;
      --blue-card: #E8EEFA;
      --blue-card-border: #C5D5F5;
      --green-card: #E2EFDA;
      --green-card-border: #C2E0B2;
      --peach-card: #FCE4D6;
      --peach-card-border: #F8CBAD;
      --text-blue: #1A5276;
      --text-dark: #1F2937;
      --border-gray: #D0D7DE;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(209, 0, 0, 0.25) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(139, 0, 0, 0.15) 0%, transparent 50%);
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px;
    }

    .portal-wrapper {
      width: 100%;
      max-width: 1520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* TOP GLOBAL CONTROLLER BAR */
    .global-toolbar {
      background: rgba(26, 4, 7, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(209, 0, 0, 0.4);
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .global-toolbar.hidden {
      display: none;
    }

    .toolbar-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--lava-red);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-action {
      background: var(--lava-red);
      color: #FFFFFF;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-action:hover {
      background: #FF1A1A;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* FLOATING UNHIDE BUTTON FOR PRESENTATION MODE */
    .unhide-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 999;
      background: rgba(209, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      display: none;
    }

    /* HEADER BRANDING */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-icon {
      font-size: 32px;
      color: var(--lava-red);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    .brand-text .title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #FFFFFF;
    }

    .brand-text .title span {
      color: var(--lava-red);
    }

    .brand-text .subtitle {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #D1D5DB;
      margin-top: 3px;
    }

    .main-heading {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: right;
    }

    .main-heading span {
      color: var(--lava-red);
    }

    /* SINGLE VA CALENDAR CONTAINER BLOCK */
    .calendar-instance {
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: rgba(20, 3, 6, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 20px;
      position: relative;
    }

    /* PER-CALENDAR EDITOR BAR (EDIT MODE ONLY) */
    .instance-editor-bar {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .instance-editor-bar.hidden {
      display: none;
    }

    .editor-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .input-field {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 6px 10px;
      color: #FFFFFF;
      font-size: 12px;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--lava-red);
    }

    select.input-field option {
      background: #110204;
      color: #FFFFFF;
    }

    .btn-delete-card {
      background: rgba(209, 0, 0, 0.2);
      border: 1px solid var(--lava-red);
      color: #FF6B6B;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-delete-card:hover {
      background: var(--lava-red);
      color: #FFFFFF;
    }

    /* PROFILE BANNER */
    .profile-banner {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .agency-box {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .agency-icon-box {
      width: 44px;
      height: 44px;
      background: rgba(209, 0, 0, 0.2);
      border: 1px solid var(--lava-red);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--lava-red);
      font-size: 20px;
    }

    .agency-details label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9CA3AF;
      display: block;
    }

    .agency-details h2 {
      font-size: 18px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.1;
    }

    .va-profile-box {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .va-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--lava-red);
      box-shadow: 0 0 12px rgba(209, 0, 0, 0.4);
    }

    .va-info label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9CA3AF;
      display: block;
    }

    .va-info h2 {
      font-size: 18px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.1;
    }

    /* BADGES */
    .meta-badges-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .support-badge {
      background: #1E3A8A;
      color: #93C5FD;
      border: 1px solid #3B82F6;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.3px;
    }

    .support-badge.commercial {
      background: #4C1D95;
      color: #DDD6FE;
      border-color: #8B5CF6;
    }

    .support-badge.both {
      background: #831843;
      color: #FBCFE8;
      border-color: #F472B6;
    }

    .va-status-tag {
      background: var(--lava-red);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* SCHEDULE MATRIX TABLE */
    .table-container {
      background: #FFFFFF;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      text-align: center;
    }

    .schedule-table th {
      font-weight: 800;
      font-size: 13px;
      padding: 10px 4px;
      border: 1px solid var(--border-gray);
    }

    .week-header-row th {
      background: var(--lava-header-bg);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-color: #5A0000;
    }

    .day-header-row th {
      background: #FFFFFF;
      color: #111827;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
    }

    .day-header-row th .day-name {
      font-size: 11px;
      font-weight: 600;
      color: #6B7280;
      display: block;
    }

    .category-cell {
      padding: 12px 14px;
      text-align: left;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 12px;
      border-right: 1px solid var(--border-gray);
      height: 100%;
    }

    .category-cell i {
      font-size: 18px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
    }

    .category-blue {
      background-color: var(--blue-card);
      color: #1E3A8A;
      border: 1px solid var(--blue-card-border);
    }
    .category-blue i { background-color: #2563EB; }

    .category-green {
      background-color: var(--green-card);
      color: #14532D;
      border: 1px solid var(--green-card-border);
    }
    .category-green i { background-color: #16A34A; }

    .category-peach {
      background-color: var(--peach-card);
      color: #7C2D12;
      border: 1px solid var(--peach-card-border);
    }
    .category-peach i { background-color: #EA580C; }

    .schedule-table td {
      border: 1px solid var(--border-gray);
      padding: 8px 6px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-blue);
      vertical-align: middle;
      background-color: #FFFFFF;
      transition: background-color 0.2s;
      cursor: pointer;
    }

    .schedule-table td:hover:not(.category-cell):not(.lava-u-cell) {
      background-color: #F0F7FF;
      color: var(--lava-red);
    }

    .lava-u-row td {
      background-color: #FCE4D6;
      color: #1E3A8A;
      font-weight: 800;
      font-size: 12px;
      border-color: #F8CBAD;
    }

    /* FOOTER BAR */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 14px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .lava-u-tag {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #FFFFFF;
    }

    .lava-u-badge {
      width: 32px;
      height: 32px;
      background: var(--lava-red);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 14px;
    }

    .lava-u-tag em {
      font-style: italic;
      font-weight: 400;
      color: #D1D5DB;
    }

    .legend-container {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .legend-dot.blue { background-color: #93C5FD; }
    .legend-dot.green { background-color: #86EFAC; }
    .legend-dot.peach { background-color: #FDBA74; }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-card {
      background: #FFFFFF;
      color: var(--text-dark);
      width: 100%;
      max-width: 450px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #6B7280;
    }

    .modal-header-tag {
      font-size: 11px;
      font-weight: 800;
      color: var(--lava-red);
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .modal-body-content {
      background: #F9FAFB;
      border-radius: 8px;
      padding: 12px;
      border-left: 4px solid var(--lava-red);
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- FLOATING UNHIDE BUTTON -->
  <button class="btn-action unhide-btn" id="unhideBtn" onclick="togglePresentationMode(false)">
    <i class="fa-solid fa-sliders"></i> Edit Mode
  </button>

  <div class="portal-wrapper">

    <!-- GLOBAL TOOLBAR -->
    <header class="global-toolbar" id="globalToolbar">
      <div class="toolbar-title">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Training Schedule Manager
      </div>
      <div class="toolbar-actions">
        <button class="btn-action" onclick="addNewSchedule()">
          <i class="fa-solid fa-plus"></i> Add Another VA Calendar
        </button>
        <button class="btn-action btn-secondary" onclick="togglePresentationMode(true)">
          <i class="fa-solid fa-eye"></i> Presentation Mode
        </button>
      </div>
    </header>

    <!-- HEADER LOGO & TITLE -->
    <header class="header-bar">
      <div class="brand-logo">
        <i class="fa-solid fa-volcano brand-logo-icon"></i>
        <div class="brand-text">
          <span class="title">LAVA</span>
          <span class="subtitle">AUTOMATION</span>
        </div>
      </div>

      <h1 class="main-heading">3-Week <span>Training Schedule</span></h1>
    </header>

    <!-- DYNAMIC CONTAINER WHERE VA CALENDARS ARE ADDED -->
    <div id="schedulesContainer" style="display: flex; flex-direction: column; gap: 30px;"></div>

  </div>

  <!-- INTERACTIVE DETAILS MODAL -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      <span class="modal-header-tag" id="modalDay">Day 1</span>
      <h3 class="modal-title" id="modalTopic">Topic Details</h3>
      <div class="modal-body-content">
        <p><i class="fa-solid fa-circle-info" style="color: var(--lava-red); margin-right: 6px;"></i> Assigned lesson module for Virtual Assistant onboarding and training progression.</p>
      </div>
    </div>
  </div>

  <script>
    let scheduleCounter = 0;
    let isPresentationMode = false;

    // Default VA Sample Preset Data
    const defaultVAs = [
      {
        agency: "Apex Insurance Agency",
        firstName: "John",
        lastName: "Doe",
        support: "Personal Lines",
        activeDay: "8",
        photo: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80"
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      // Initialize with default VA calendar
      defaultVAs.forEach(va => addNewSchedule(va));
    });

    function addNewSchedule(data = null) {
      scheduleCounter++;
      const id = scheduleCounter;

      const agency = data ? data.agency : "New Insurance Agency";
      const firstName = data ? data.firstName : "Jane";
      const lastName = data ? data.lastName : "Smith";
      const support = data ? data.support : "Commercial Lines";
      const activeDay = data ? data.activeDay : "1";
      const photo = data ? data.photo : "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=150&auto=format&fit=crop&q=80";

      const cardHTML = `
        <div class="calendar-instance" id="schedule-card-${id}">
          
          <!-- EDIT CONTROLS BAR -->
          <div class="instance-editor-bar ${isPresentationMode ? 'hidden' : ''}">
            <div class="editor-group">
              <span style="font-size: 11px; font-weight: 800; color: var(--lava-red); text-transform: uppercase;">
                <i class="fa-solid fa-pen-to-square"></i> Calendar #${id} Settings:
              </span>
              
              <input type="text" id="agencyInput-${id}" class="input-field" value="${agency}" placeholder="Agency Name" oninput="updateCardDisplay(${id})">
              <input type="text" id="fnInput-${id}" class="input-field" value="${firstName}" placeholder="VA First Name" style="width: 110px;" oninput="updateCardDisplay(${id})">
              <input type="text" id="lnInput-${id}" class="input-field" value="${lastName}" placeholder="VA Last Name" style="width: 110px;" oninput="updateCardDisplay(${id})">

              <!-- INSURANCE SUPPORT DROPDOWN -->
              <select id="supportSelect-${id}" class="input-field" onchange="updateCardDisplay(${id})">
                <option value="Personal Lines" ${support === 'Personal Lines' ? 'selected' : ''}>Personal Lines</option>
                <option value="Commercial Lines" ${support === 'Commercial Lines' ? 'selected' : ''}>Commercial Lines</option>
                <option value="Personal & Commercial Lines" ${support === 'Personal & Commercial Lines' ? 'selected' : ''}>Personal & Commercial Lines</option>
              </select>

              <!-- ACTIVE DAY DROPDOWN -->
              <select id="daySelect-${id}" class="input-field" onchange="updateCardDisplay(${id})">
                ${Array.from({length: 15}, (_, i) => `<option value="${i+1}" ${activeDay == (i+1) ? 'selected' : ''}>Day ${i+1} of 15</option>`).join('')}
              </select>

              <!-- UPLOAD PHOTO -->
              <input type="file" id="photoInput-${id}" class="input-field" accept="image/*" style="width: 160px;" onchange="handlePhotoUpload(event, ${id})">
            </div>

            <button class="btn-delete-card" onclick="removeSchedule(${id})">
              <i class="fa-solid fa-trash-can"></i> Remove Calendar
            </button>
          </div>

          <!-- PRESENTATION BANNER -->
          <section class="profile-banner">
            <div class="agency-box">
              <div class="agency-icon-box">
                <i class="fa-solid fa-building-shield"></i>
              </div>
              <div class="agency-details">
                <label>Insurance Agency</label>
                <h2 id="agencyDisplay-${id}">${agency}</h2>
              </div>
            </div>

            <div class="va-profile-box">
              <img id="avatarDisplay-${id}" src="${photo}" alt="VA Photo" class="va-avatar">
              
              <div class="va-info">
                <label>Assigned Virtual Assistant</label>
                <h2 id="vaNameDisplay-${id}">${firstName} ${lastName}</h2>
              </div>

              <div class="meta-badges-group">
                <!-- INSURANCE SUPPORT BADGE -->
                <div class="support-badge" id="supportBadge-${id}">
                  <i class="fa-solid fa-file-contract"></i> <span id="supportBadgeText-${id}">${support}</span>
                </div>

                <!-- ACTIVE DAY BADGE -->
                <div class="va-status-tag">
                  <i class="fa-solid fa-circle-play"></i> Active: <span id="dayBadgeText-${id}">Day ${activeDay} of 15</span>
                </div>
              </div>
            </div>
          </section>

          <!-- 3-WEEK MATRIX TABLE -->
          <div class="table-container">
            <table class="schedule-table">
              <thead>
                <tr class="week-header-row">
                  <th style="width: 16%; background: #4A0000;">Category</th>
                  <th colspan="5">WEEK 1</th>
                  <th colspan="5">WEEK 2</th>
                  <th colspan="5">WEEK 3</th>
                </tr>
                <tr class="day-header-row">
                  <th style="background: #FAFAFA;">Training Days</th>
                  <th><span class="day-name">Monday</span>Day 1</th>
                  <th><span class="day-name">Tuesday</span>Day 2</th>
                  <th><span class="day-name">Wednesday</span>Day 3</th>
                  <th><span class="day-name">Thursday</span>Day 4</th>
                  <th><span class="day-name">Friday</span>Day 5</th>
                  <th><span class="day-name">Monday</span>Day 6</th>
                  <th><span class="day-name">Tuesday</span>Day 7</th>
                  <th><span class="day-name">Wednesday</span>Day 8</th>
                  <th><span class="day-name">Thursday</span>Day 9</th>
                  <th><span class="day-name">Friday</span>Day 10</th>
                  <th><span class="day-name">Monday</span>Day 11</th>
                  <th><span class="day-name">Tuesday</span>Day 12</th>

    function removeSchedule(id) {
      const card = document.getElementById(`schedule-card-${id}`);
      if (card) {
        card.remove();
      }
    }

    function updateCardDisplay(id) {
      const agencyVal = document.getElementById(`agencyInput-${id}`).value.trim() || 'Insurance Agency';
      const fnVal = document.getElementById(`fnInput-${id}`).value.trim();
      const lnVal = document.getElementById(`lnInput-${id}`).value.trim();
      const supportVal = document.getElementById(`supportSelect-${id}`).value;
      const dayVal = document.getElementById(`daySelect-${id}`).value;

      document.getElementById(`agencyDisplay-${id}`).innerText = agencyVal;
      document.getElementById(`vaNameDisplay-${id}`).innerText = `${fnVal} ${lnVal}`.trim() || 'Virtual Assistant';
      document.getElementById(`supportBadgeText-${id}`).innerText = supportVal;
      document.getElementById(`dayBadgeText-${id}`).innerText = `Day ${dayVal} of 15`;

      // Badge Styling
      const supportBadge = document.getElementById(`supportBadge-${id}`);
      supportBadge.className = "support-badge";
      if (supportVal === 'Commercial Lines') {
        supportBadge.classList.add('commercial');
      } else if (supportVal === 'Personal & Commercial Lines') {
        supportBadge.classList.add('both');
      }
    }

    function handlePhotoUpload(e, id) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          document.getElementById(`avatarDisplay-${id}`).src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function togglePresentationMode(hideControls) {
      isPresentationMode = hideControls;
      const toolbar = document.getElementById('globalToolbar');
      const unhideBtn = document.getElementById('unhideBtn');
      const editorBars = document.querySelectorAll('.instance-editor-bar');

      if (hideControls) {
        toolbar.classList.add('hidden');
        unhideBtn.style.display = 'flex';
        editorBars.forEach(bar => bar.classList.add('hidden'));
      } else {
        toolbar.classList.remove('hidden');
        unhideBtn.style.display = 'none';
        editorBars.forEach(bar => bar.classList.remove('hidden'));
      }
    }

    function showDetails(day, topic) {
      document.getElementById('modalDay').innerText = day;
      document.getElementById('modalTopic').innerText = topic;
      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('detailModal').style.display = 'none';
    }

    window.onclick = function(e) {
      const modal = document.getElementById('detailModal');
      if (e.target === modal) closeModal();
    }
  </script>
