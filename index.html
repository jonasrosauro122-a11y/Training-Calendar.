<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAVA Automation – Multi-VA Training Portal</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- FLOATING EDIT MODE UNHIDE BUTTON -->
  <button class="btn-action unhide-btn" id="unhideBtn">
    <i class="fa-solid fa-sliders"></i> Edit Mode
  </button>

  <div class="portal-wrapper">

    <!-- GLOBAL MANAGER TOOLBAR -->
    <header class="global-toolbar" id="globalToolbar">
      <div class="toolbar-title">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Training Schedule Manager
      </div>
      <div class="toolbar-actions">
        <button class="btn-action" id="addScheduleBtn">
          <i class="fa-solid fa-plus"></i> Add Another VA Calendar
        </button>
        <button class="btn-action btn-secondary" id="presentationModeBtn">
          <i class="fa-solid fa-eye"></i> Presentation Mode
        </button>
      </div>
    </header>

    <!-- HEADER LOGO & TITLE -->
    <header class="header-bar">
      <div class="brand-logo">
        <i class="fa-solid fa-volcano brand-logo-icon"></i>
        <div class="brand-text">
          <span class="title">LAVA</span>
          <span class="subtitle">AUTOMATION</span>
        </div>
      </div>

      <h1 class="main-heading">3-Week <span>Training Schedule</span></h1>
    </header>

    <!-- DYNAMIC CONTAINER FOR VA CALENDARS -->
    <div id="schedulesContainer" class="schedules-stack"></div>

  </div>

  <!-- INTERACTIVE DETAILS MODAL -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-card">
      <button class="modal-close" id="modalCloseBtn"><i class="fa-solid fa-xmark"></i></button>
      <span class="modal-header-tag" id="modalDay">Day 1</span>
      <h3 class="modal-title" id="modalTopic">Topic Details</h3>
      <div class="modal-body-content">
        <p><i class="fa-solid fa-circle-info modal-info-icon"></i> Assigned lesson module for Virtual Assistant onboarding and training progression.</p>
      </div>
    </div>
  </div>

  <!-- Custom Script -->
  <script src="script.js"></script>
</body>
</html>
